# Copy these values to JVM system properties or environment variables.
# Do not commit a real SMTP password or OTP secret.
DIABETESCARE_SMTP_HOST=smtp.gmail.com
DIABETESCARE_SMTP_PORT=587
DIABETESCARE_SMTP_USERNAME=your-email@gmail.com
DIABETESCARE_SMTP_PASSWORD=your-google-app-password
DIABETESCARE_SMTP_FROM=your-email@gmail.com
DIABETESCARE_OTP_SECRET=replace-with-a-long-random-secret
# Enable only on a local development machine without SMTP. The OTP is written to the server log.
DIABETESCARE_OTP_DEV_MODE=false
